name: iOS
on:
  workflow_dispatch:          # solo a mano: cada ejecución gasta minutos de macOS
    inputs:
      tests:
        description: "Pasar también los tests en el simulador (gasta más minutos)"
        type: boolean
        default: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Configuración de Magic Friends: sale de secretos del repo (Settings → Secrets and variables → Actions), nunca del
      # código. Gradle la lee del entorno y genera MagicFriendsConfig.kt (ver shared/build.gradle.kts). Sin ellos la app
      # compila igual, con Magic Friends desactivado.
      MAGICFRIENDS_SERVER_URL: ${{ secrets.MAGICFRIENDS_SERVER_URL }}
      MAGICFRIENDS_APP_KEY: ${{ secrets.MAGICFRIENDS_APP_KEY }}
    steps:
      - uses: actions/checkout@v4
      # Librería de Magic Friends: carpeta hermana, porque settings.gradle.kts hace includeBuild("../magicfriends/client").
      # actions/checkout no puede escribir fuera del workspace, por eso se clona a mano. Mientras el repo sea público no
      # hacen falta credenciales; si pasa a privado habrá que usar un token de solo lectura (secreto del repo).
      - name: Clonar la librería de Magic Friends
        run: git clone --depth 1 https://github.com/jmlopezsalvador/magicfriends.git ../magicfriends
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests de la lógica en iOS
        if: ${{ inputs.tests }}
        run: ./gradlew :shared:iosSimulatorArm64Test --no-daemon
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Generar el proyecto de Xcode
        working-directory: iosApp
        run: xcodegen generate
      - name: Compilar para iPhone (sin firmar) y empaquetar .ipa
        working-directory: iosApp
        run: |
          xcodebuild build \
            -project iosApp.xcodeproj -scheme iosApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Chronix.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../Chronix.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: Chronix-ios-sin-firmar
          path: iosApp/build/Chronix.ipa
          if-no-files-found: error
          # El .ipa lleva dentro la appKey y el repo es público (cualquier usuario de GitHub puede descargar los
          # artefactos): que caduque en 1 día y borrar el run tras descargarlo (gh run delete <id>).
          retention-days: 1
